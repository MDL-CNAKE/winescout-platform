<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CruScout — Il cruscotto del piccolo produttore</title>
<meta name="description" content="Machine learning e AI generativa per piccole cantine. Include l'analisi di un data leakage che gonfiava l'R² del 29%.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Righteous&display=swap" rel="stylesheet">
<style>
  :root {
    --bordeaux: #6d1b2f;
    --bordeaux-dark: #4a1220;
    --bordeaux-deep: #3a0e19;
    --gold: #c9a24b;
    --cream: #f4ece2;
    --bg: #faf7f2;
    --ink: #2a2a2a;
    --muted: #8a8177;
    --font-ui: "Inter", "Segoe UI", system-ui, sans-serif;
    --font-display: "Righteous", "Trebuchet MS", sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: var(--font-ui);
    color: var(--ink);
    background: var(--bg);
    line-height: 1.6;
  }
  a { color: inherit; text-decoration: none; }

  /* ---------- navbar ---------- */
  .nav {
    background: var(--bordeaux-dark);
    padding: 14px 6vw;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .monogram {
    width: 36px; height: 36px;
    border: 1.5px solid var(--gold);
    border-radius: 6px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    line-height: 1.02;
    font-family: var(--font-display);
    font-size: 9px; letter-spacing: 0.6px;
  }
  .monogram span:first-child { color: var(--cream); }
  .monogram span:last-child  { color: var(--gold); }
  .brand-word {
    font-family: var(--font-display);
    font-size: 18px; color: var(--cream); letter-spacing: 0.3px;
  }
  .brand-word em { font-style: normal; color: var(--gold); }
  .nav-links { display: flex; gap: 22px; font-size: 13px; }
  .nav-links a { color: rgba(244,236,226,0.72); }
  .nav-links a:hover { color: var(--cream); }
  .lang { display: flex; gap: 4px; font-size: 12px; }
  .lang button {
    background: transparent; border: 1px solid transparent;
    color: rgba(244,236,226,0.6); padding: 4px 8px; border-radius: 4px;
    cursor: pointer; font: inherit; letter-spacing: 0.5px;
  }
  .lang button.active { color: var(--gold); border-color: rgba(201,162,75,0.5); }
  .lang button:hover:not(.active) { color: var(--cream); }

  /* ---------- hero ---------- */
  .hero {
    background: var(--bordeaux-deep);
    padding: 88px 6vw 76px;
    text-align: center;
  }
  .eyebrow {
    margin: 0 0 16px; font-size: 12px; letter-spacing: 2.6px;
    text-transform: uppercase; color: var(--gold);
  }
  .hero h1 {
    margin: 0 0 14px;
    font-family: var(--font-display); font-weight: 400;
    font-size: clamp(34px, 6vw, 60px); line-height: 1.06;
    color: var(--cream); letter-spacing: -0.5px;
  }
  .hero p {
    margin: 0 auto 34px; max-width: 520px;
    font-size: 16px; line-height: 1.65; color: rgba(244,236,226,0.7);
  }
  .cta { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn {
    display: inline-block; padding: 12px 28px; border-radius: 6px;
    font-size: 14px; font-weight: 500; transition: background .15s, color .15s;
  }
  .btn-primary { background: var(--bordeaux); color: var(--cream); }
  .btn-primary:hover { background: #8a2b3a; }
  .btn-ghost { border: 1px solid rgba(201,162,75,0.65); color: var(--gold); }
  .btn-ghost:hover { background: rgba(201,162,75,0.1); }

  /* ---------- sections ---------- */
  section { padding: 56px 6vw; }
  .section-label {
    margin: 0 0 26px; font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--muted);
  }
  .grid {
    display: grid; gap: 28px;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  }
  .stat { border-left: 3px solid var(--bordeaux); padding-left: 16px; }
  .stat .num {
    margin: 0 0 6px; font-family: var(--font-display);
    font-size: 40px; line-height: 1; color: var(--bordeaux-dark);
  }
  .stat p { margin: 0; font-size: 14px; line-height: 1.55; color: #4a4038; }
  .stat a { color: var(--bordeaux); font-size: 13px; display: inline-block; margin-top: 8px; }
  .stat a:hover { text-decoration: underline; }

  .alt { background: #fff; border-top: 1px solid #ebe4d8; border-bottom: 1px solid #ebe4d8; }
  .feat h3 {
    margin: 0 0 6px; font-size: 15px; font-weight: 600; color: var(--bordeaux-dark);
  }
  .feat p { margin: 0; font-size: 14px; color: #4a4038; line-height: 1.55; }

  .quote {
    max-width: 680px; margin: 0 auto; text-align: center;
    font-size: 19px; line-height: 1.6; color: var(--bordeaux-dark);
  }
  .quote small { display: block; margin-top: 14px; font-size: 13px; color: var(--muted); }

  /* ---------- footer ---------- */
  footer {
    background: var(--bordeaux-dark); color: rgba(244,236,226,0.6);
    padding: 34px 6vw; font-size: 13px; text-align: center; line-height: 1.8;
  }
  footer a { color: var(--gold); }

  @media (max-width: 640px) {
    .nav-links { display: none; }
    .hero { padding: 64px 6vw 56px; }
  }
</style>
</head>
<body>

<nav class="nav">
  <a class="brand" href="#top">
    <div class="monogram" aria-hidden="true"><span>CRU</span><span>SCT</span></div>
    <span class="brand-word">Cru<em>Scout</em></span>
  </a>
  <div class="nav-links">
    <a href="#trovato" data-i18n="nav.findings"></a>
    <a href="#dentro" data-i18n="nav.inside"></a>
    <a href="https://github.com/MDL-CNAKE/winescout-platform" data-i18n="nav.code"></a>
  </div>
  <div class="lang" role="group" aria-label="Lingua">
    <button data-lang="it">IT</button>
    <button data-lang="en">EN</button>
    <button data-lang="fr">FR</button>
  </div>
</nav>

<header class="hero" id="top">
  <p class="eyebrow" data-i18n="hero.eyebrow"></p>
  <h1 data-i18n="hero.title"></h1>
  <p data-i18n="hero.sub"></p>
  <div class="cta">
    <a class="btn btn-primary" href="#demo" data-i18n="hero.demo"></a>
    <a class="btn btn-ghost" href="https://github.com/MDL-CNAKE/winescout-platform" data-i18n="hero.code"></a>
  </div>
</header>

<section id="trovato">
  <p class="section-label" data-i18n="findings.label"></p>
  <div class="grid">
    <div class="stat">
      <p class="num">29%</p>
      <p data-i18n="findings.leak"></p>
      <a href="https://github.com/MDL-CNAKE/winescout-platform/blob/main/docs/model_limitations.md" data-i18n="findings.read"></a>
    </div>
    <div class="stat">
      <p class="num">47×</p>
      <p data-i18n="findings.asym"></p>
      <a href="https://github.com/MDL-CNAKE/winescout-platform/blob/main/docs/model_limitations.md" data-i18n="findings.read"></a>
    </div>
    <div class="stat">
      <p class="num">100%</p>
      <p data-i18n="findings.rag"></p>
      <a href="https://github.com/MDL-CNAKE/winescout-platform/blob/main/docs/model_limitations.md" data-i18n="findings.read"></a>
    </div>
  </div>
</section>

<section class="alt" id="dentro">
  <p class="section-label" data-i18n="inside.label"></p>
  <div class="grid">
    <div class="feat"><h3 data-i18n="inside.ml.t"></h3><p data-i18n="inside.ml.d"></p></div>
    <div class="feat"><h3 data-i18n="inside.rules.t"></h3><p data-i18n="inside.rules.d"></p></div>
    <div class="feat"><h3 data-i18n="inside.rag.t"></h3><p data-i18n="inside.rag.d"></p></div>
    <div class="feat"><h3 data-i18n="inside.tools.t"></h3><p data-i18n="inside.tools.d"></p></div>
    <div class="feat"><h3 data-i18n="inside.eval.t"></h3><p data-i18n="inside.eval.d"></p></div>
    <div class="feat"><h3 data-i18n="inside.stack.t"></h3><p data-i18n="inside.stack.d"></p></div>
  </div>
</section>

<section>
  <p class="quote">
    <span data-i18n="quote.text"></span>
    <small data-i18n="quote.who"></small>
  </p>
</section>

<footer id="demo">
  <span data-i18n="footer.demo"></span><br>
  <a href="https://github.com/MDL-CNAKE/winescout-platform">github.com/MDL-CNAKE/winescout-platform</a><br>
  <span data-i18n="footer.by"></span>
</footer>

const TITLES = {
  it: "CruScout — Il cruscotto del piccolo produttore",
  en: "CruScout — The small winemaker's dashboard",
  fr: "CruScout — Le tableau de bord du petit vigneron"
};

function applica(lang) {
  const d = T[lang] || T.it;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const k = el.getAttribute("data-i18n");
    if (d[k] !== undefined) el.innerHTML = d[k];
  });
  document.documentElement.lang = lang;
  document.title = TITLES[lang];
  document.querySelectorAll(".lang button").forEach(b =>
    b.classList.toggle("active", b.dataset.lang === lang));
  try { localStorage.setItem("cruscout-lang", lang); } catch (e) {}
}

document.querySelectorAll(".lang button").forEach(b =>
  b.addEventListener("click", () => applica(b.dataset.lang)));

// Lingua iniziale: quella scelta in precedenza, altrimenti quella del
// browser se e' fra le tre, altrimenti italiano.
let iniziale = "it";
try { iniziale = localStorage.getItem("cruscout-lang") || iniziale; } catch (e) {}
if (!localStorage.getItem("cruscout-lang")) {
  const nav = (navigator.language || "").slice(0, 2);
  if (T[nav]) iniziale = nav;
}
applica(iniziale);
