services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: winescout
      MYSQL_USER: winescout
      MYSQL_PASSWORD: winescout
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--protocol=TCP", "-h", "127.0.0.1", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 3s
      retries: 20

  flyway:
    image: flyway/flyway:10
    command: -url=jdbc:mysql://mysql:3306/winescout?allowPublicKeyRetrieval=true -user=winescout -password=winescout migrate
    volumes:
      - ./db/migration:/flyway/sql
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
