server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fallback SPA: le rotte client-side (/catalogo, /packaging, ...) non
    # esistono come file su disco. Senza try_files, un refresh su quelle
    # URL restituirebbe 404 da nginx invece di lasciare che sia il router
    # React a gestirle.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
